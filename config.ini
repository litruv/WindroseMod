; WindroseMod — edit this file (or config.local.ini for machine-only overrides).
; Leave a value empty to use auto-detection where supported.

[Paths]
; Folder containing Engine\ (optional; otherwise Epic Launcher + R5.uproject)
UeRoot=
; Full path to Windrose-Win64-Shipping.exe (optional; otherwise Steam search)
GameExe=
; Where BuildAndLaunch installs the mod pak
LogicModsDir=C:\Program Files (x86)\Steam\steamapps\common\Windrose\R5\Content\Paks\LogicMods
; Local pack output folder (optional; default Releases\ModPak under project)
ArchiveDir=

[Mod]
; UE4SS mod id — must match .pak / .utoc / .ucas base name and config.lua Mods["..."]
PakBaseName=windrosemod
; Content path to cook (Unreal /Game path)
ModCookDir=/Game/Mods/WindroseMod
; UE4SS BPModLoaderMod entry (generated into config.lua)
ModActorAssetPath=/Game/Mods/WindroseMod/ModActor
ModActorClassName=ModActor_C

[Import]
; Sibling folder for UHT header dump (Track B rebuild)
UhtHeaderDumpDir=../UHTHeaderDump
